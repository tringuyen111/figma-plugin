name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify clean source checkout
        run: npm run clean:check

      - name: Run source, test, bundle, and standalone-runtime gates
        run: npm run build

      - name: Verify accountable MCP contract without live Figma
        run: node scripts/smoke-mcp-operation.mjs --status-only

      - name: Verify package contents and metadata
        run: npm run check:package

      - name: Restore and verify source-clean state
        run: npm run clean && npm run clean:check
